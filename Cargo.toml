[package]
name = "openos"
version = "0.2.0"
edition = "2021"
authors = ["OpenOS Contributors"]
description = "OpenOS — a microkernel operating system"
license = "MIT OR Apache-2.0"

[workspace]
members = ["kernel", "sdk", "user/hello_rs", "user/net_echo", "user/ping", "user/test_sdk", "user/shell_rs", "user/curl_rs", "user/nc_rs", "user/devmgr", "user/kb_driver", "user/net_driver", "user/ld_so", "user/coreutils", "user/ifconfig_rs", "user/cal", "user/tar", "tools/mkinitrd"]
# Exclude bare-metal user-space crates from `cargo test --workspace` —
# they define #![no_main] + #[panic_handler] which conflict with std.
default-members = ["kernel", "sdk", "tools/mkinitrd"]

[dependencies]
bootloader = { version = "0.11", features = ["bios", "uefi"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
