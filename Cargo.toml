[package]
name = "openos"
version = "0.2.0"
edition = "2021"
authors = ["OpenOS Contributors"]
description = "OpenOS — a microkernel operating system"
license = "MIT OR Apache-2.0"

[workspace]
members = ["kernel", "sdk"]

[dependencies]
bootloader = { version = "0.11", features = ["bios"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
