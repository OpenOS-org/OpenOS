[package]
name = "openos-kernel"
version = "0.1.0"
edition = "2021"
authors = ["OpenOS Contributors"]
description = "OpenOS microkernel"
license = "MIT OR Apache-2.0"

[dependencies]
bootloader_api = "0.11"
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions", "nightly", "abi_x86_interrupt"] }
spin = "0.9.9"
uart_16550 = "0.3.2"
pic8259 = "0.11.0"
pc-keyboard = "0.7"
linked_list_allocator = "0.10.6"

[dependencies.lazy_static]
version = "1.5"
features = ["spin_no_std"]
